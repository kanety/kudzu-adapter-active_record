default: &default
  adapter: mysql2
  pool: 100
  timeout: 5000
  charset: utf8mb4
  collation: utf8mb4_bin
  encoding: utf8mb4

development:
  <<: *default
  database: kudzu_development

test:
  <<: *default
  database: kudzu_test
  <% if ENV['CI'] %>
  host: 127.0.0.1
  username: root
  <% end %>

production:
  <<: *default
  database: kudzu_production
